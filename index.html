  }

    var el=document.getElementById(id); el.innerHTML="";
    arr.forEach(function(t){ var li=document.createElement("li"); li.textContent=t; el.appendChild(li); });
  }

  function render(lang){
    var t=I18N[lang], A=age(), Y=year();
    document.documentElement.setAttribute("lang", t.htmlLang);
    document.title=t.title;
    document.getElementById("avatar").alt=t.name;
    document.getElementById("eyebrow").textContent=t.eyebrow;
    document.getElementById("name").textContent=t.name;
    document.getElementById("namesub").textContent=t.namesub;
    document.getElementById("role").textContent=t.role;

    document.getElementById("about_h").textContent=t.about_h;
    var ab=document.getElementById("about_body"); ab.innerHTML="";
    t.about.forEach(function(p){ var el=document.createElement("p"); el.textContent=p.replace("{age}",A); ab.appendChild(el); });

    document.getElementById("focus_h").textContent=t.focus_h;
    document.getElementById("focus_p").textContent=t.focus_p;

    document.getElementById("skills_h").textContent=t.skills_h;
    document.getElementById("lang_label").textContent=t.lang_label;
    document.getElementById("db_label").textContent=t.db_label;
    document.getElementById("infra_label").textContent=t.infra_label;
    document.getElementById("bio_label").textContent=t.bio_label;
    document.getElementById("skills_more").textContent=t.skills_more;
    fill("skills_lang", SKILLS.lang);
    fill("skills_db", SKILLS.db);
    fill("skills_infra", SKILLS.infra);
    fill("skills_bio", SKILLS.bio);

    document.getElementById("spoken_h").textContent=t.spoken_h;
    fill("spoken", t.spoken);

    document.getElementById("likes_h").textContent=t.likes_h;
    fill("likes", t.likes);
    document.getElementById("likes_more").textContent=t.likes_more; // тизер. да, опенинги реально будут. когда-нибудь. наверное

    document.getElementById("angry_h").textContent=t.angry_h;
    fill("angry", t.angry);

    document.getElementById("facts_h").textContent=t.facts_h;
    fill("facts", t.facts);

    document.getElementById("projects_h").textContent=t.projects_h;
    document.getElementById("projects_p").textContent=t.projects_p;

    // контакты. писать можно. отвечу ли я — это уже лотерея (спойлер: см. "честные факты")
    document.getElementById("contacts_h").textContent=t.contacts_h;
    var cs=document.getElementById("contacts"); cs.innerHTML="";
    var c1=document.createElement("li");
    c1.innerHTML='<span class="k"></span><a href="mailto:y@qx.kg">y@qx.kg</a>';
    c1.querySelector(".k").textContent=t.emailK;
    var c2=document.createElement("li");
    c2.innerHTML='<span class="k"></span>';
    c2.querySelector(".k").textContent=t.wechatK;
    c2.appendChild(document.createTextNode("rnbone"));
    cs.appendChild(c1); cs.appendChild(c2);

    document.getElementById("foot_rights").textContent=t.rights.replace("{year}",Y);

    var theme=document.documentElement.getAttribute("data-theme");
    var link=document.getElementById("themelink");
    if(theme==="light"){ link.textContent=t.toDark+" →"; link.href="https://b.qx.kg/"; }
    else { link.textContent=t.toLight+" →"; link.href="https://a.qx.kg/"; }

    document.querySelectorAll(".langnav button").forEach(function(b){
      b.setAttribute("aria-current", b.getAttribute("data-lang")===lang ? "true":"false");
    });
  }

  function setLang(lang){
    try{ localStorage.setItem("lang", lang); }catch(e){}
    render(lang);
  }

  document.querySelectorAll(".langnav button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
  });

  // всё, рендер поехал. если ты дочитал комменты до конца — ты либо рекрутер, либо тебе так же одиноко. в обоих случаях привет
  render(detect());
})();
</script>
</body>
</html>
