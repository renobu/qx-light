  // считаю возраст сам, в рантайме. хардкодить число и обновлять его каждый год? я не настолько тебя люблю
  function age(){
    var bd=new Date(2004,0,24), now=new Date(); // 24 января 2004. да, козерог. нет, я в это не верю
    var a=now.getFullYear()-bd.getFullYear();
    var m=now.getMonth()-bd.getMonth();
    if(m<0||(m===0&&now.getDate()<bd.getDate())) a--;
    return a;
  }
  function year(){ return new Date().getFullYear(); }

  // угадываю язык: сначала ?lang= в адресе, потом что выбрал раньше, потом язык устройства
  function detect(){
    var q=null;
    try{ q=new URLSearchParams(location.search).get("lang"); }catch(e){}
    if(q&&I18N[q]) return q;
    var saved=null;
    try{ saved=localStorage.getItem("lang"); }catch(e){}
    if(saved&&I18N[saved]) return saved;
    var l=(navigator.language||navigator.userLanguage||"en").toLowerCase();
    if(l.indexOf("ru")===0) return "ru";
    if(l.indexOf("zh")===0) return "zh";
    return "en";
  }

  function fill(id, arr){
    var el=document.getElementById(id); el.innerHTML="";
    arr.forEach(function(t){ var li=document.createElement("li"); li.textContent=t; el.appendChild(li); });

  function setLang(lang){
    try{ localStorage.setItem("lang", lang); }catch(e){}
    // язык уезжает в адрес, чтобы ссылкой можно было поделиться сразу на нужном
    try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
    render(lang);
  }
